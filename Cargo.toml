[package]
name = "gears2"
version = "0.1.0"
edition = "2021"
description = "Herringbone spur, ring and planetary gears as closed triangle meshes (STL), for the browser via WebAssembly."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rustc-hash = "2"
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Tests do a lot of floating point work; optimize them too.
[profile.test]
opt-level = 3
