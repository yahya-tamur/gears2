<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Gear Generator</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <main class="layout">
    <form id="options" class="options" autocomplete="off" novalidate>
      <h1>Gear generator</h1>
      <div id="fields"></div>
      <div class="file-actions">
        <p id="import-error" class="error-box" role="alert" hidden></p>
        <div id="file-buttons" class="file-row">
          <button type="button" id="save-settings" title="Save this gear's settings to a small text file">Save Gear Settings</button>
          <button type="button" id="import-settings" title="Load a saved gear settings file">Load Gear Settings</button>
        </div>
        <div id="import-choices" class="file-row" hidden>
          <button type="button" id="import-anyway">Load valid settings</button>
          <button type="button" id="import-cancel">Cancel</button>
        </div>
        <input type="file" id="settings-file" accept=".txt,text/plain" hidden>
      </div>
      <div class="dock">
        <p id="error" class="error-box" role="alert" hidden></p>
        <div class="actions">
          <button type="submit" id="generate" disabled>Loading…</button>
          <button type="button" id="download" disabled>Download STL</button>
          <button type="button" id="download-step" disabled>Download STEP</button>
        </div>
        <p id="status" class="status" role="status"></p>
        <button type="button" id="restore" class="restore" hidden>Restore the values from before the search</button>
      </div>
    </form>
    <div class="resizer" id="resizer" role="separator" aria-orientation="vertical" aria-label="Resize the options column"></div>

    <section class="viewer">
      <canvas id="canvas"></canvas>
      <p class="hint">Drag to rotate, scroll to zoom, right-drag to pan.</p>
      <div class="view-controls">
        <div class="vc-row" id="hold-row" title="Which part of the planetary set stays still" hidden>
          <span class="vc-label">Hold</span>
          <span class="vc-widget hold-buttons"><button type="button" class="hold" data-hold="ring">Ring</button><button type="button" class="hold" data-hold="carrier">Carrier</button></span>
          <span></span>
        </div>
        <div class="vc-row" id="spin-row" title="Spin the gears in mesh: stop in the middle, faster toward the ends" hidden>
          <span class="vc-label">
            <button type="button" id="spin-reset" class="icon" title="Stop, and put the teeth back where the STL and STEP files have them" aria-label="Stop and reset">
              <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M3 8a5 5 0 1 0 1.6-3.7M3 2.5v2.6h2.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>Spin
          </span>
          <span class="vc-widget slider"><span class="track"><span class="ticks" id="spin-ticks"></span><input type="range" id="spin" min="-1" max="1" step="1" value="0" aria-label="Spin speed"></span></span>
          <span></span>
        </div>
        <label class="vc-row" title="Cut away the top of the model, to see inside it (only in this view, not in the STL)">
          <span class="vc-label">Section view</span>
          <input type="range" class="vc-widget" id="section" min="0" max="100" step="1" value="100">
          <span id="section-value">off</span>
        </label>
        <label class="vc-row" title="Field of view: how much perspective the view has. 0° looks from infinitely far away, so sizes don't change with depth.">
          <span class="vc-label">FOV</span>
          <input type="range" class="vc-widget" id="fov" min="0" max="179" step="1" value="0">
          <span id="fov-value">0°</span>
        </label>
      </div>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
